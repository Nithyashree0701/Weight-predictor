<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Weight Predictor</h1>
    <p class="subtitle">Linear Regression model</p>

    <form method="post" action="/">
      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="Male" {% if gender == 'Male' %}selected{% endif %}>Male</option>
        <option value="Female" {% if gender == 'Female' %}selected{% endif %}>Female</option>
      </select>

      <label for="height">Height (inches)</label>
      <input id="height" type="number" step="any" name="height"
             value="{{ height }}" placeholder="e.g. 70" required>

      <button type="submit">Predict</button>
    </form>

    {% if result is not none %}
  <div class="result">
     Predicted weight: <strong>{{ result }} kg</strong>
      <p style="margin: 6px 0 0; font-size: 0.9rem;">Model confidence: <strong>{{ accuracy }}%</strong></p>
  </div>
  {% endif %}




    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </main>
</body>
</html>
